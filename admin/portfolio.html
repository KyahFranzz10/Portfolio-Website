<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Portfolio - Admin Console</title>
    
    <!-- Security Auth Guard (loaded first before any render) -->
    <script src="auth.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="admin-shared.css">
</head>
<body class="admin-body">
    <!-- Cosmic Background Elements -->
    <div class="abstract-bg">
        <div class="gradient-sphere shape-1"></div>
        <div class="gradient-sphere shape-2"></div>
        <div class="gradient-sphere shape-3"></div>
        <div class="noise-overlay"></div>
    </div>

    <!-- Unified Layout Placeholders -->
    <div id="admin-header-placeholder"></div>
    <div id="admin-sidebar-placeholder"></div>

    <main class="admin-main">
        <div class="admin-container">
            <!-- Portfolio Management Grid -->
            <section class="admin-section">
                <h2>
                    <span><i class="fas fa-briefcase"></i> Manage Portfolio Projects</span>
                    <button class="btn-admin btn-add" onclick="showForm('portfolio')">
                        <i class="fas fa-plus"></i> Add Project
                    </button>
                </h2>
                
                <div id="portfolio-list" class="item-list">
                    <!-- Dynamically loaded projects go here -->
                </div>
            </section>

            <!-- Glassmorphic Modal Editor Form -->
            <div id="form-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(6, 11, 25, 0.7); z-index:1000; align-items:center; justify-content:center;">
                <div class="modal-content-panel">
                    <div class="modal-header">
                        <h3 id="form-title">Add New Item</h3>
                        <button type="button" class="btn-close-modal" onclick="hideForm()" aria-label="Close modal">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <form id="admin-form">
                        <input type="hidden" id="item-type">
                        <input type="hidden" id="item-id">
                        
                        <div class="form-group" id="title-group">
                            <label for="item-title">Title / Caption</label>
                            <input type="text" id="item-title" required placeholder="Enter project title...">
                        </div>
                        
                        <div class="form-group" id="desc-group">
                            <label for="item-desc">Description (Portfolio Only)</label>
                            <textarea id="item-desc" rows="3" placeholder="Provide a summary of the project..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="item-media-type">Media Type</label>
                            <select id="item-media-type">
                                <option value="image">Image</option>
                                <option value="video">Video</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="item-file">Upload Media (Image or Video File)</label>
                            <input type="file" id="item-file" accept="image/*,video/*" style="padding: 10px 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--clr-text); width: 100%; outline: none;">
                            <input type="hidden" id="item-url">
                        </div>

                        <div class="form-group" id="tags-group">
                            <label for="item-tags">Tags (Comma separated)</label>
                            <input type="text" id="item-tags" placeholder="e.g. React, Node.js, CSS">
                        </div>

                        <div class="form-group" id="link-group">
                            <label for="item-link">Project Link (GitHub / Live Demo)</label>
                            <input type="text" id="item-link" placeholder="e.g. https://github.com/username/project">
                        </div>

                        <div class="form-group" id="status-group">
                            <label for="item-status">Deployment Status (Portfolio Only)</label>
                            <select id="item-status">
                                <option value="deployed">Deployed</option>
                                <option value="not-deployed">Not Deployed / Local Only</option>
                                <option value="in-progress">In Progress</option>
                            </select>
                        </div>

                        <div class="modal-actions">
                            <button type="submit" class="btn-admin btn-save">
                                <i class="fas fa-save"></i> Save Item
                            </button>
                            <button type="button" class="btn-admin btn-cancel" onclick="hideForm()">
                                <i class="fas fa-times"></i> Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Project Details Modal -->
    <div id="project-modal" class="project-modal-overlay">
        <div class="project-modal-content glass-card" style="z-index: 10000;">
            <button class="modal-close-btn" aria-label="Close Modal" onclick="window.closeProjectModal()"><i class="fas fa-times"></i></button>
            <div id="modal-body-content"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="admin-shared.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages - Admin Console</title>
    
    <!-- Security Auth Guard (loaded first before any render) -->
    <script src="auth.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="admin-shared.css">
</head>
<body class="admin-body">
    <!-- Cosmic Background Elements -->
    <div class="abstract-bg">
        <div class="gradient-sphere shape-1"></div>
        <div class="gradient-sphere shape-2"></div>
        <div class="gradient-sphere shape-3"></div>
        <div class="noise-overlay"></div>
    </div>

    <!-- Unified Layout Placeholders -->
    <div id="admin-header-placeholder"></div>
    <div id="admin-sidebar-placeholder"></div>

    <main class="admin-main">
        <div class="admin-container">
            <div class="admin-header-flex">
                <h2><span><i class="fas fa-inbox"></i> Contact Messages</span></h2>
            </div>
            
            <section class="admin-section">
                <div id="messages-list" class="admin-list-container">
                    <!-- Messages will be rendered here dynamically -->
                </div>
            </section>
        </div>
    </main>

    <!-- Scripts -->
    <script src="admin-shared.js?v=3"></script>
</body>
</html>

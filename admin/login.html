<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Jhon Francis Garapan</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="login.css">
    <script>
        // Set theme immediately to avoid flash of dark/light theme on load
        const currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
    </script>
</head>
<body class="login-body">
    <!-- Cosmic Background Elements -->
    <div class="abstract-bg">
        <div class="gradient-sphere shape-1"></div>
        <div class="gradient-sphere shape-2"></div>
        <div class="gradient-sphere shape-3"></div>
        <div class="noise-overlay"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card glass-card">
            <div class="login-header">
                <h2>Admin <span>Portal</span></h2>
                <p>Sign in to manage your portfolio, gallery, and socials.</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" required placeholder="Enter username..." autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" required placeholder="Enter password...">
                        <button type="button" id="togglePassword" class="toggle-password-btn" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="login-error" class="login-error-msg" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i> Invalid username or password.
                </div>

                <button type="submit" class="btn-admin btn-login">
                    Sign In <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            
            <div class="login-footer">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> Return to Site</a>
            </div>
        </div>
    </div>

    <script>
        // Password Visibility Toggle Logic
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            // Toggle eye icon class
            const icon = togglePassword.querySelector('i');
            icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // Sign In Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('login-error');

            const showError = () => {
                errorDiv.style.display = 'block';
                // Add soft shake animation
                const card = document.querySelector('.login-card');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);
            };

            // Fall back to client-side check if server is offline or serving static files
            console.warn("Using client-side fallback authentication.");
            await clientAuth(user, pass, showError);
        });

        // SHA-256 hashing utility using native browser Crypto API
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Offline / Static Authentication
        async function clientAuth(user, pass, showError) {
            const passHash = await sha256(pass);
            // SHA-256 hash of 'admin123'
            const expectedHash = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';
            
            if (user === 'admin' && passHash === expectedHash) {
                sessionStorage.setItem('admin_logged_in', 'true');
                window.location.href = 'index.html';
            } else {
                showError();
            }
        }
    </script>
</body>
</html>

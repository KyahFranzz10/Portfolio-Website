<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhon Francis Garapan - Contact</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <div class="abstract-bg">
        <div class="gradient-sphere shape-1"></div>
        <div class="gradient-sphere shape-2"></div>
        <div class="gradient-sphere shape-3"></div>
        <div class="particle p-1"></div>
        <div class="particle p-2"></div>
        <div class="particle p-3"></div>
        <div class="particle p-4"></div>
        <div class="particle p-5"></div>
        <div class="noise-overlay"></div>
    </div>

    <!-- Header Module Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Sidebar Module Placeholder -->
    <div id="sidebar-placeholder"></div>

    <main>
        <section id="contact" class="section contact">
            <div class="container">
                <div class="section-header">
                    <h2>Get In <span class="highlight">Touch</span></h2>
                    <p>Let's discuss future opportunities or collaborations</p>
                </div>
                
                <div class="contact-wrapper glass-card">
                    <div class="contact-info">
                        <h3>Contact Information</h3>
                        <p>Feel free to reach out to me via email or through my social media channels.</p>
                        
                        <div class="info-items">
                            <div class="info-item">
                                <i class="fas fa-envelope"></i>
                                <div>
                                    <h4>Email</h4>
                                    <p id="contact-page-email">student@university.edu</p>
                                </div>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-phone-alt"></i>
                                <div>
                                    <h4>Phone</h4>
                                    <p id="contact-page-phone">+1 (234) 567-8900</p>
                                </div>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>
                                    <h4>Location</h4>
                                    <p id="contact-page-location">Tech City, State, Country</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="contact-form">
                        <form id="contactForm">
                            <div class="form-group">
                                <input type="text" id="msg-name" placeholder="Your Name" required>
                            </div>
                            <div class="form-group">
                                <input type="email" id="msg-email" placeholder="Your Email" required>
                            </div>
                            <div class="form-group">
                                <input type="text" id="msg-subject" placeholder="Subject" required>
                            </div>
                            <div class="form-group">
                                <textarea id="msg-body" rows="5" placeholder="Your Message" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Send Message <i class="fas fa-paper-plane"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Module Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="js/global.js?v=4"></script>
    <script src="js/contact.js?v=4"></script>
</body>
</html>
